<!DOCTYPE html>
<html lang='pt-br'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Formulário</title>
    <link rel='stylesheet' href='main.css'>
</head>

<body>
    <h1>Página de Cadastro</h1>
    <form>
        <fieldset>
            <legend>Crie sua conta</legend>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">

            <label for="email-user">E-mail:</label>
            <input type="email" id="email-user" name="email" placeholder="seu@email.com" required>


            <label for="senha">Senha (Mínimo 8 caracteres):</label>
            <input type="password" id="senha" name="senha">

            <h3>Gênero</h3>

            <input type="radio" id="masculino" name="genero" value="masculino" required>
            <label for="masculino">Masculino</label><br>

            <input type="radio" id="feminino" name="genero" value="feminino" required>
            <label for="feminino">Feminino</label><br>

            <input type="radio" id="outro" name="genero" value="outro" required>
            <label for="outro">Outro</label><br>
<br>
            <label for="biografia">Biografia:</label><br>
            <textarea id="biografia" name="biografia" rows="5" cols="40"
                placeholder="Fale um pouco sobre você..."></textarea><br>

            <input type="checkbox" <p>Eu li e aceito os termos de serviços.</p>

        </fieldset>
<br>
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>

    </form>
</body>

</html>
